name: ac-consent-test
services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wp
      MARIADB_PASSWORD: wp_pass
      MARIADB_ROOT_PASSWORD: root_pass
    volumes:
      - db_data:/var/lib/mysql
    networks: [ acnet ]
  wordpress:
    image: wordpress:6.6-php8.2-apache
    depends_on: [ db ]
    ports: [ "127.0.0.1:8094:80" ]
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp_pass
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "1"
    volumes:
      - wp_data:/var/www/html
      - ./plugin:/var/www/html/wp-content/plugins/ac-consent:ro
    networks: [ acnet ]
  wpcli:
    image: wordpress:cli-php8.2
    depends_on: [ wordpress, db ]
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp_pass
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp_data:/var/www/html
      - ./plugin:/var/www/html/wp-content/plugins/ac-consent:ro
    entrypoint: ["tail","-f","/dev/null"]
    networks: [ acnet ]
volumes:
  db_data:
  wp_data:
networks:
  acnet:
