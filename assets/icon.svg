<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <clipPath id="globe-clip">
      <circle cx="48" cy="68" r="34"/>
    </clipPath>
  </defs>

  <!-- Globe background -->
  <circle cx="48" cy="68" r="34" fill="#2271b1"/>

  <!-- Globe grid lines (clipped to circle) -->
  <g clip-path="url(#globe-clip)" stroke="#fff" stroke-width="1.2" fill="none" opacity="0.3">
    <ellipse cx="48" cy="68" rx="34" ry="11"/>
    <ellipse cx="48" cy="68" rx="34" ry="24"/>
    <ellipse cx="48" cy="68" rx="11" ry="34"/>
    <ellipse cx="48" cy="68" rx="24" ry="34"/>
    <line x1="14" y1="68" x2="82" y2="68"/>
    <line x1="48" y1="34" x2="48" y2="102"/>
  </g>

  <!-- Globe border -->
  <circle cx="48" cy="68" r="34" fill="none" stroke="#135e96" stroke-width="2.5"/>

  <!-- Speech bubble -->
  <path d="M64,22 h46 a8,8 0 0 1 8,8 v28 a8,8 0 0 1 -8,8 h-32 l-8,10 l-2,-10 h-4 a8,8 0 0 1 -8,-8 v-28 a8,8 0 0 1 8,-8 z" fill="#fff" stroke="#2271b1" stroke-width="2.5"/>

  <!-- "A" source character -->
  <text x="74" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="bold" fill="#2271b1">A</text>

  <!-- Arrow -->
  <path d="M92,45 l8,0 M97,41 l3,4 l-3,4" fill="none" stroke="#999" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Foreign character -->
  <text x="104" y="52" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#d63638">&#25991;</text>
</svg>
